<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction-Game</title>
    <link rel="stylesheet" href="css/stylesheet.css">
    <script src="js/script.js" defer></script>

</head>
<body>
    <main>

        <section id="player1">
            Player 1
            <br>
            <span class="subtext">Press A or Screen</span>
        </section>
        <section id="indicator">
            Start
        </section>
        <section id="player2">
            Player 2
            <br>
            <span class="subtext">Press L or Screen</span>
        </section>

        <button id="retry">
            ↺
        </button>
    </main>
</body>
</html>
